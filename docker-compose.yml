services:
  mc-server:
    image: itzg/minecraft-server:latest
    container_name: mc-server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "NEOFORGE"             # Le dices que instale NeoForge
      VERSION: "1.21.1"            # Versión de Minecraft
      # NEOFORGE_VERSION: "latest"      # Solo el loader (lo que ves junto a la estrella)
      # MEMORY: "4G"               # opcional: RAM para el servidor
    volumes:
      - "./data:/data"
      - "./mods:/data/mods"
    restart: unless-stopped
